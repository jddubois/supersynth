[package]
name = "supersynth-host"
version = "0.1.0"
edition = "2021"
description = "The engine as its hosts drive it (Node.js through napi, browsers through WebAssembly): commands, validation, models"

[lib]
path = "src/lib.rs"

[dependencies]
supersynth-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
