[package]
name = "supersynth-core"
version = "0.2.0"
edition = "2021"
description = "Real-time spectral-model synthesis engine (pure Rust core of supersynth)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssrender"
path = "src/bin/ssrender.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rtrb = "0.3"
thread-priority = "1"

[dev-dependencies]
