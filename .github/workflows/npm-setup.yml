name: npm setup

# One-off, run by hand after the first release has published every package (Actions → npm setup
# → Run workflow). Makes each @supersynth package trust release.yml, so releases publish without
# a token (OIDC), and can unpublish the old unscoped `supersynth` package (now @supersynth/core).
# Uses the NPM_TOKEN secret (a granular token with write access to @supersynth and supersynth).
on:
  workflow_dispatch:
    inputs:
      trust:
        description: Make every @supersynth package trust release.yml
        type: boolean
        default: true
      unpublish-old:
        description: Unpublish the unscoped `supersynth` package (all versions)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm 11 (npm trust)
        run: npm install -g npm@11

      - name: Token owner
        run: npm whoami

      - name: Trust release.yml
        if: inputs.trust
        run: |
          failed=0
          for dir in . npm/*/ packages/*/; do
            name=$(node -p "require('./${dir%/}/package.json').name")
            if [ -z "$(npm view "$name" version 2>/dev/null)" ]; then
              echo "::warning::$name is not on npm yet; skipped"
              continue
            fi
            if npm trust list "$name" 2>/dev/null | grep -q 'release.yml'; then
              echo "$name already trusts release.yml"
              continue
            fi
            echo "::group::$name"
            npm trust github "$name" --repository "$GITHUB_REPOSITORY" --file release.yml --allow-publish --yes || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: Unpublish the unscoped supersynth package
        if: inputs.unpublish-old
        run: |
          if [ -n "$(npm view supersynth version 2>/dev/null)" ]; then
            npm unpublish supersynth --force
          else
            echo "supersynth is not on npm"
          fi
